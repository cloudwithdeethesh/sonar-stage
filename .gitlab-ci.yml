stages:
  - Unit_Test_Generation
  - Unit_Test_Execution
  - Quality_Gate
  - Sonar_Recommendation

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  tags: [local-mac]
  image: python:3.12.16-slim-bookworm

generate_tests:
  stage: Unit_Test_Generation
  script:
    - 'echo "placeholder - stage 1 — tests are hand-written and committed (see milestone 1)"'

run_tests:
  stage: Unit_Test_Execution
  script:
    - pip install --no-cache-dir -r requirements-dev.txt
    - pytest
  artifacts:
    when: always
    paths:
      - coverage.xml
      - test-report.xml
    reports:
      junit: test-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

sonarqube_scan:
  stage: Quality_Gate
  image:
    name: sonarsource/sonar-scanner-cli:12.4.0.4321_8.4.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  allow_failure: true
  script:
    - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL

sonar_recommendation:
  stage: Sonar_Recommendation
  needs:
    - job: sonarqube_scan
      artifacts: false
  variables:
    DRY_RUN: "true"
  script:
    - python -m QC.sonar_evaluator
  artifacts:
    when: always
    paths:
      - sonar-recommendation-report.json
