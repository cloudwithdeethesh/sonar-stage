[tool.pytest.ini_options]
addopts = [
  "-v",
  "--strict-markers",
  "--import-mode=importlib",
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=70",
  "--junit-xml=test-report.xml",
]
testpaths = ["tests/unit-tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
